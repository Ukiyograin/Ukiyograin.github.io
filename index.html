<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Serendisand []~(￣▽￣)~*干杯~  二次元 | 技术宅 | 热爱生活 | 学习ing</title>
    <link rel="icon" type="image/jpeg" href="icon/icon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<div class="container">
    <div class="hero">
        <div class="title-group">
            <h1 id="siteTitle">Serendisand []~(￣▽￣)~*干杯~</h1>
            <div class="tagline" id="siteTagline">热爱生活，以及生活给予我的一切</div>
        </div>
        <div class="header-actions">
            <div class="top-buttons">
                <div class="theme-wheel-wrapper" id="themeWheelWrapper">
                    <button class="wheel-trigger" id="wheelTriggerBtn" data-tooltip="主题轮盘">
                        <i class="fas fa-palette"></i>
                    </button>
                    <div class="theme-ring-panel" id="themeRingPanel">
                        <div class="ring-container" id="ringContainer"></div>
                        <div class="wheel-center-info" id="wheelCenterInfo">
                            <i class="fas fa-brush"></i>
                            <span id="centerThemeName">流沙金</span>
                        </div>
                    </div>
                </div>
                <div class="ctrl-btn" id="langSwitchBtn" data-tooltip="切换语言">
                    <i class="fas fa-globe"></i> <span id="langText">中文</span>
                </div>
                <div class="music-player" id="musicPlayer">
                    <button class="music-toggle-btn" id="musicBtn" data-tooltip="背景音乐">
                        <div class="music-disc" id="musicDisc">
                            <i class="fas fa-music"></i>
                        </div>
                        <div class="music-ring"></div>
                    </button>
                </div>
            </div>
            <div id="external-links" style="display: flex; gap: 0.6rem; flex-wrap: wrap;"></div>
        </div>
    </div>

    <div id="github-profile-container">
        <div class="status-message" id="loading-placeholder">
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                <div class="loader" id="loadingSpinner"></div>
                <span id="loadingMsg">正在从 GitHub 获取创作轨迹 ...</span>
            </div>
        </div>
    </div>

    <div id="snake-container" class="snake-container"></div>

    <div id="repos-carousel-section" class="carousel-section" style="display: none;">
        <div class="section-title">
            <span><i class="fas fa-code-branch" style="margin-right: 6px;"></i> <span id="reposTitle">开源项目</span></span>
            <span class="repo-count" id="repo-count-badge">0 repositories</span>
        </div>
        <div class="carousel-container">
            <button class="carousel-btn btn-prev" id="repoPrevBtn"><i class="fas fa-chevron-left"></i></button>
            <div class="carousel-track" id="repoCarouselTrack"></div>
            <button class="carousel-btn btn-next" id="repoNextBtn"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="carousel-dots" id="repoDots"></div>
    </div>

    <div id="marquee-section" class="marquee-section" style="display: none;">
        <div class="section-title">
            <span><i class="fas fa-images" style="margin-right: 6px;"></i> <span id="galleryTitle">精选照片</span></span>
        </div>
        <div class="marquee-wrapper">
            <div class="marquee-track" id="marqueeTrack"></div>
        </div>
    </div>

    <footer>
        <i class="fas fa-terminal"></i> <span id="footerText">Serendisand</span>
        <span style="margin: 0 8px">✦</span> <span id="footerSub">We found that your request fell into the water.</span>
    </footer>
</div>

<div id="lightbox" class="lightbox">
    <div class="lightbox-close" id="lightboxCloseBtn"><i class="fas fa-times"></i></div>
    <img id="lightboxImg" src="" alt="预览大图">
</div>

<div class="music-iframe-container" id="musicIframeContainer">
    <iframe id="musicIframe" frameborder="no" border="0" marginwidth="0" marginheight="0" width="330" height="86" src="" allow="autoplay"></iframe>
</div>

<script src="assets/js/site-config.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
